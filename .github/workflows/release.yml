name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 前置: 仓库 Settings -> Actions -> General -> Workflow permissions 必须是
# "Read and write permissions". 设成 read 时创建 release 会报
# Resource not accessible by integration, 编译本身仍然成功.

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      # 手动触发只编译并留产物, 不打 release, 避免拿分支名当版本号.
      - name: 编译 (手动触发)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build

      - name: 上传产物 (手动触发)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: binance-mini-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/binance-mini.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # 推 v* 标签: 编译并创建 draft release, 附件自动挂上 exe 与安装包.
      - name: 编译并发布
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: binance-mini ${{ github.ref_name }}
          releaseBody: |
            Windows x64 (用户级安装, 无需管理员权限).

            - `BinanceMini_0.1.0_x64-setup.exe` 安装包
            - `binance-mini.exe` 免安装版
          # 直接发布, 不留草稿: 私有仓库自己用, 多一步"点发布"只会让 Releases 页面看着是空的.
          releaseDraft: false
          prerelease: false

      # tauri-action 只挂 bundle 产物; 免安装版单独补传, 保持 README 里的两个下载项一致.
      - name: 附带免安装 exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/release/binance-mini.exe --clobber
