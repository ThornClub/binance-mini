name: release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1

jobs:
  quality:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 前端测试
        run: npm test

      - name: TypeScript 检查
        run: npx --no-install tsc --noEmit

      - name: 前端构建
        run: npm run build

      - name: 会话桥接自检
        run: node tests/session-bridge.mjs

      - name: Rust 测试
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -j 1

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -j 1 -- -D warnings

  build:
    needs: quality
    # PR只运行只读门禁; 失败的门禁不得进入打包与发布.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      # master push和手动运行只留产物; 手动选择标签也不发布.
      - name: 编译 (非标签推送)
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- -- --locked -j 1

      - name: 上传产物 (非标签推送)
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: binance-mini-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/binance-mini.exe
            src-tauri/target/release/bundle/nsis/*.exe

      # v*标签推送在门禁通过后直接发布安装包, 不创建草稿.
      - name: 编译并发布
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -- --locked -j 1
          tagName: ${{ github.ref_name }}
          releaseName: binance-mini ${{ github.ref_name }}
          releaseBody: |
            Windows x64 (用户级安装, 无需管理员权限).

            - `BinanceMini_*_x64-setup.exe` 安装包
            - `binance-mini.exe` 免安装版
          releaseDraft: false
          prerelease: false

      # tauri-action只挂bundle产物; 免安装版单独补传.
      - name: 附带免安装 exe
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/binance-mini.exe --clobber
