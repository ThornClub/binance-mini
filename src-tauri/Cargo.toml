[package]
name = "binance-mini"
version = "0.1.0"
description = "币安 USDT-M 合约桌面盯盘组件"
authors = ["bro"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"
urlencoding = "2.1.3"
zeroize = "1.9.1"
thiserror = "2.0.21"
parking_lot = "0.13.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# codegen-units=1 会让单个编译单元过大, 在本机 rustc 1.99 上出现过 STATUS_STACK_BUFFER_OVERRUN.
# 用 8 个单元 + thin LTO, 体积差异在 1MB 以内, 编译稳定性优先.
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
